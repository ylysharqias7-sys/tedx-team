<script>
  // مؤقت للتشخيص: يظهر أي خطأ برمجي في شريط أحمر أعلى الصفحة بدل ما يفشل بصمت
  (function(){
    var errors = [];
    function showBanner(){
      var old = document.getElementById('diagErrorBanner');
      if(old) old.remove();
      var div = document.createElement('div');
      div.id = 'diagErrorBanner';
      div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px 14px;font-family:monospace;font-size:12px;z-index:999999;direction:ltr;text-align:left;white-space:pre-wrap;max-height:40vh;overflow:auto;';
      div.textContent = 'JS ERROR(S) DETECTED:\n' + errors.join('\n---\n');
      (document.body || document.documentElement).appendChild(div);
    }
    window.addEventListener('error', function(e){
      var msg = e.message || (e.target && ('Failed to load: ' + (e.target.src || e.target.href))) || 'unknown error';
      errors.push(msg + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
      if(document.readyState !== 'loading') showBanner(); else document.addEventListener('DOMContentLoaded', showBanner);
    }, true);
    window.addEventListener('unhandledrejection', function(e){
      errors.push('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      if(document.readyState !== 'loading') showBanner(); else document.addEventListener('DOMContentLoaded', showBanner);
    });
  })();
</script>

<style>
  :root{
    --black:#0A0A0C;
    --black2:#151519;
    --red:#E62B1E;
    --red-dim:#7a1811;
    --paper:#F7F4EF;
    --paper2:#FFFFFF;
    --ink:#17181C;
    --muted:#8B8A85;
    --line:#E4E0D6;
    --green:#1F9D55;
    --amber:#C98A1A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal', sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  .wordmark{
    font-family:Arial, 'Helvetica Neue', sans-serif;
    font-weight:800;
    letter-spacing:-1px;
  }
  .wordmark .x{ color:var(--red); }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input, select{ font-family:inherit; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#c9c5ba; border-radius:4px; }

  .screen{ min-height:100vh; width:100%; }
  [hidden]{ display:none !important; }

  /* ---------- GATE ---------- */
  .gate{
    background:var(--black);
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .spotlight{
    position:absolute;
    top:-20%;
    left:50%;
    transform:translateX(-50%);
    width:900px; height:900px;
    background:radial-gradient(circle, rgba(230,43,30,0.35) 0%, rgba(230,43,30,0.08) 40%, rgba(230,43,30,0) 70%);
    pointer-events:none;
  }
  .gate-inner{ position:relative; z-index:2; text-align:center; padding:24px; max-width:560px; }
  .gate-inner .wordmark{ font-size:64px; color:#fff; }
  .gate-inner .subtitle{ color:#c9c7c2; font-size:16px; margin-top:6px; font-weight:500; letter-spacing:.5px; }
  .gate-cards{ display:flex; gap:16px; margin-top:44px; flex-wrap:wrap; justify-content:center; }
  .gate-card{
    background:var(--black2);
    border:1px solid #2a2a30;
    border-radius:14px;
    padding:26px 22px;
    width:220px;
    text-align:right;
    transition:transform .15s ease, border-color .15s ease;
  }
  .gate-card:hover{ transform:translateY(-4px); border-color:var(--red); }
  .gate-card h3{ color:#fff; font-size:18px; margin-bottom:8px; }
  .gate-card p{ color:#9b9994; font-size:13px; line-height:1.6; }
  .gate-foot{ margin-top:40px; color:#5c5a55; font-size:12px; }

  /* ---------- CENTER AUTH SCREENS ---------- */
  .center-screen{
    background:var(--paper);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .auth-card{
    background:var(--paper2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:32px;
    width:100%; max-width:420px;
    position:relative;
  }
  .auth-card.wide{ max-width:560px; }
  .back-btn{ color:var(--muted); font-size:14px; margin-bottom:18px; }
  .back-btn:hover{ color:var(--red); }
  .auth-card h2{ font-size:22px; font-weight:800; margin-bottom:20px; }
  .auth-card input[type=password], .auth-card input[type=text]{
    width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:10px;
    font-size:15px; margin-bottom:12px; background:var(--paper);
  }
  .error-text{ color:var(--red); font-size:13px; margin-bottom:10px; min-height:16px; }
  .btn-primary{
    background:var(--red); color:#fff; padding:12px 20px; border-radius:10px;
    font-weight:700; font-size:15px; width:100%; text-align:center;
    transition:background .15s;
  }
  .btn-primary:hover{ background:#c72217; }
  .btn-ghost{
    border:1px solid var(--line); padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600;
    background:var(--paper2);
  }
  .btn-ghost:hover{ border-color:var(--red); color:var(--red); }
  .btn-outline-red{ border:1px solid var(--red); color:var(--red); padding:9px 14px; border-radius:9px; font-weight:700; font-size:13px; }
  .btn-outline-red:hover{ background:var(--red); color:#fff; }
  .scan-row{ display:flex; gap:8px; }
  .scan-row input{ flex:1; }
  .scan-toggle{ margin:14px 0; }
  .reader-box{ display:none; width:100%; max-width:320px; margin:0 auto 14px; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .reader-box.active{ display:block; }

  /* ---------- DASHBOARD LAYOUT ---------- */
  .dashboard{ display:flex; min-height:100vh; }
  .sidebar{
    width:230px; flex:0 0 230px; background:var(--black); color:#fff;
    display:flex; flex-direction:column; padding:20px 14px; position:sticky; top:0; height:100vh;
  }
  .sidebar .brand{ font-size:20px; margin-bottom:26px; padding:0 6px; }
  .sidebar .brand small{ color:#9b9994; font-weight:400; font-size:12px; }
  .sidebar nav{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .nav-btn{
    text-align:right; padding:12px 14px; border-radius:10px; font-size:14.5px; font-weight:600;
    color:#c9c7c2; transition:background .15s, color .15s;
  }
  .nav-btn:hover{ background:#1d1d22; color:#fff; }
  .nav-btn.active{ background:var(--red); color:#fff; }
  .logout-btn{ color:#9b9994; font-size:13.5px; padding:10px 14px; text-align:right; border-top:1px solid #232327; margin-top:10px; }
  .logout-btn:hover{ color:var(--red); }

  .content{ flex:1; padding:28px 32px; max-width:1100px; }
  .tab-panel h1{ font-size:24px; font-weight:800; margin-bottom:4px; }
  .tab-sub{ color:var(--muted); font-size:13.5px; margin-bottom:22px; }

  .card{ background:var(--paper2); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:18px; }
  .card h3{ font-size:15px; font-weight:800; margin-bottom:14px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  @media (max-width:640px){ .grid2,.grid3{ grid-template-columns:1fr; } }

  /* ---------- RESPONSIVE / MOBILE ---------- */
  @media (max-width:820px){
    .dashboard{ flex-direction:column; }
    .sidebar{
      width:100%; flex:0 0 auto; height:auto; position:sticky; top:0; z-index:40;
      flex-direction:row; align-items:center; padding:10px 12px; overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    .sidebar .brand{ margin-bottom:0; margin-left:10px; flex:0 0 auto; white-space:nowrap; }
    .sidebar nav{ flex-direction:row; flex:0 0 auto; gap:6px; }
    .nav-btn{ white-space:nowrap; padding:9px 12px; font-size:13.5px; }
    .logout-btn{ border-top:none; margin-top:0; margin-right:auto; white-space:nowrap; padding:9px 12px; }
    .content{ padding:18px 14px; max-width:100%; }
  }
  @media (max-width:480px){
    .gate-inner .wordmark{ font-size:42px; }
    .gate-card{ width:100%; max-width:280px; }
    .auth-card{ padding:22px 18px; }
    .stat-box{ min-width:calc(50% - 6px); }
    .modal-box{ padding:18px; }
    .badge-card{ width:100%; max-width:280px; }
  }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; font-weight:600; }
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px; font-size:14px; background:var(--paper);
  }
  .stat-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .stat-box{
    background:var(--black); color:#fff; border-radius:12px; padding:16px 20px; min-width:130px; flex:1;
  }
  .stat-box .num{ font-size:26px; font-weight:800; }
  .stat-box.red{ background:var(--red); }
  .stat-box.green{ background:var(--green); }
  .stat-box .lbl{ font-size:12px; color:#d9d7d2; margin-top:2px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td{ padding:9px 8px; text-align:right; border-bottom:1px solid var(--line); }
  th{ color:var(--muted); font-weight:700; font-size:12.5px; }
  tr:last-child td{ border-bottom:none; }
  .table-wrap{ overflow-x:auto; }
  .chip{
    display:inline-block; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700;
    background:#efece4; color:var(--ink);
  }
  .chip.HR{ background:#e7f0ff; color:#2952a3; }
  .chip.PR{ background:#ffe9e6; color:#c0362a; }
  .chip.OP{ background:#eaf6ea; color:#237a3c; }
  .chip.SC{ background:#fff3da; color:#9a6a08; }
  .chip.MK{ background:#f2e9ff; color:#6a35b8; }

  .row-actions{ display:flex; gap:6px; }
  .icon-btn{ padding:5px 9px; border-radius:7px; border:1px solid var(--line); font-size:13px; }
  .icon-btn:hover{ border-color:var(--red); }
  .icon-btn.danger:hover{ background:var(--red); color:#fff; border-color:var(--red); }

  .committee-filter-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .filter-pill{ padding:7px 14px; border-radius:999px; border:1px solid var(--line); font-size:13px; font-weight:600; background:var(--paper2); }
  .filter-pill.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .cat-chip{ padding:9px 16px; border-radius:10px; border:1.5px solid var(--line); font-size:13.5px; font-weight:700; background:var(--paper2); }
  .cat-chip.active{ background:var(--red); border-color:var(--red); color:#fff; }
  .cat-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

  .found-box{ border:1.5px dashed var(--line); border-radius:12px; padding:14px; margin:12px 0; text-align:center; color:var(--muted); font-size:13.5px; }
  .found-box.ok{ border-style:solid; border-color:var(--green); background:#f1faf3; color:var(--ink); }
  .found-box.err{ border-style:solid; border-color:var(--red); background:#fff3f2; color:var(--red); }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }
  .empty-state .em{ font-size:34px; margin-bottom:10px; }

  /* modal */
  #modalRoot{ position:fixed; inset:0; z-index:50; pointer-events:none; }
  .modal-overlay{ pointer-events:auto; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,12,0.55);
    display:flex; align-items:center; justify-content:center; padding:20px; overflow-y:auto;
  }
  .modal-box{
    background:var(--paper2); border-radius:16px; padding:26px; max-width:640px; width:100%;
    max-height:88vh; overflow-y:auto; position:relative;
  }
  .modal-close{ position:absolute; top:16px; left:16px; font-size:20px; color:var(--muted); }
  .modal-close:hover{ color:var(--red); }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }

  .badge-card{
    width:280px; margin:10px auto; background:var(--black); color:#fff; border-radius:16px;
    padding:24px 20px; text-align:center; border:2px dashed #3a3a40;
  }
  .badge-top{ font-family:Arial,sans-serif; font-weight:800; font-size:22px; margin-bottom:16px; }
  .badge-top .x{ color:var(--red); }
  .badge-name{ font-size:18px; font-weight:800; margin-bottom:4px; }
  .badge-committee{ font-size:12.5px; color:#c9c7c2; margin-bottom:14px; }
  .badge-card svg{ background:#fff; border-radius:6px; padding:6px; width:100%; }
  .badge-code{ font-size:12px; letter-spacing:1px; color:#c9c7c2; margin-top:6px; }

  /* print */
  @media print{
    body.is-printing > *:not(.print-target){ display:none !important; }
    body.is-printing > .print-target{ display:block !important; }
    .no-print{ display:none !important; }
    #modalRoot.print-target .modal-overlay{ position:static; background:none; padding:0; }
    #modalRoot.print-target .modal-box{ max-height:none; box-shadow:none; }
  }
</style>
</head>

  <!-- GATE -->

<script>
/* ================= CONFIG ================= */
const LEADER_PASSWORD = "tedx2026"; // غيّر كلمة مرور القيادة من هنا

/* ---- إعدادات Supabase ----
   عشان البيانات تتحفظ فعلاً وتشتغل لكل اللي بيفتحوا اللينك، لازم تحط بيانات مشروع Supabase بتاعك هنا.
   الخطوات:
   1) روح https://supabase.com وسجل حساب مجاني (بالإيميل أو جوجل) — من غير أي بطاقة بنكية
   2) دوس "New project"، اختار اسم وباسورد لقاعدة البيانات (سيبهم عندك، مش هتحتاجهم في الكود) واختار أقرب Region
   3) بعد ما المشروع يتفعّل، من القائمة الجانبية روح "SQL Editor" ونفّذ الكود ده مرة واحدة:
        create table tedx_data (
          key text primary key,
          value jsonb
        );
        alter table tedx_data enable row level security;
        create policy "public access" on tedx_data for all using (true) with check (true);
   4) من القائمة الجانبية روح Settings > API، هتلاقي "Project URL" و "anon public" key
   5) انسخهم وحطهم مكان القيم الوهمية تحت
      (ملاحظة أمان: زي ما كان في الحل الأول، القاعدة دي مفتوحة لأي حد يعرف الرابط لأن مفيش تسجيل دخول حقيقي بيربط بالمستخدمين، كلمة مرور القيادة بتتفحص في المتصفح بس. مناسب لفريق صغير موثوق)
*/
const SUPABASE_URL = "https://nboibnxftubtvfmemzwx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ib2libnhmdHVidHZmbWVtend4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2NzM1MDksImV4cCI6MjEwMDI0OTUwOX0.9LUk043TeZNWkI7IJ-1XO2PH8GJrg1zjApvLKRvLrVY";
let db = null;
let firebaseReady = false;
try{
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  firebaseReady = true;
}catch(e){
  console.error('Supabase init failed', e);
}

const COMMITTEES = [
  {id:'HR', name:'الموارد البشرية'},
  {id:'PR', name:'العلاقات العامة'},
  {id:'OP', name:'العمليات'},
  {id:'SC', name:'المتحدثين والتدريب'},
  {id:'MK', name:'التسويق'},
];

const CATEGORIES = [
  {id:'quiz', label:'كويز', points:10},
  {id:'task', label:'مهمة / تاسك', points:20},
  {id:'engage', label:'تفاعل ومشاركة', points:5},
  {id:'role', label:'دور تنظيمي', points:15},
  {id:'other', label:'أخرى', points:5},
];

const STORE_KEYS = {
  members:'tedx_members',
  attendance:'tedx_attendance',
  points:'tedx_points',
  activeDays:'tedx_active_days',
};

/* ================= STATE ================= */
const state = {
  members:[], attendance:[], points:[], activeDays:[],
  isLeader:false,
  currentTab:'members',
  pointsCategory: CATEGORIES[0].id,
  pointsFoundCode: null,
};

const scanners = {}; // containerId -> Html5Qrcode instance

/* ================= STORAGE (Supabase) ================= */
async function loadAll(){
  if(!firebaseReady){
    alert('تعذر الاتصال بقاعدة البيانات. تأكد من إعداد بيانات Supabase في أول ملف الكود (SUPABASE_URL و SUPABASE_ANON_KEY).');
    return;
  }
  for(const key in STORE_KEYS){
    try{
      const {data, error} = await db.from('tedx_data').select('value').eq('key', STORE_KEYS[key]).maybeSingle();
      if(error) throw error;
      state[key] = (data && Array.isArray(data.value)) ? data.value : [];
    }catch(e){
      console.error('load failed', key, e);
      state[key] = state[key] || [];
    }
  }
}
async function persist(key){
  if(!firebaseReady) return;
  try{
    const {error} = await db.from('tedx_data').upsert({key: STORE_KEYS[key], value: state[key]});
    if(error) throw error;
  }catch(e){
    console.error('save failed', key, e);
    alert('تعذر حفظ البيانات، تأكد من اتصالك بالإنترنت وحاول تاني.');
  }
}

/* ================= HELPERS ================= */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '';
  try{ return new Date(d+'T00:00:00').toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'}); }
  catch(e){ return d; }
}
function committeeName(id){ const c = COMMITTEES.find(x=>x.id===id); return c? c.name : id; }
function committeeOptions(includeAll){
  let html = includeAll ? '<option value="all">كل اللجان</option>' : '<option value="">اختر اللجنة...</option>';
  html += COMMITTEES.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  return html;
}
function categoryLabel(id){ const c = CATEGORIES.find(x=>x.id===id); return c? c.label : id; }
function nextMemberCode(committee){
  let n = state.members.filter(m=>m.committee===committee).length + 1;
  let code = `${committee}-${String(n).padStart(3,'0')}`;
  while(state.members.some(m=>m.code===code)){ n++; code = `${committee}-${String(n).padStart(3,'0')}`; }
  return code;
}

/* ================= SCANNER ================= */
const SUPPORTED_FORMATS = (typeof Html5QrcodeSupportedFormats !== 'undefined') ? [
  Html5QrcodeSupportedFormats.QR_CODE,
  Html5QrcodeSupportedFormats.CODE_128,
  Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.EAN_13,
] : undefined;

function makeDebounced(handler){
  let last = {code:null, t:0};
  return (text)=>{
    const now = Date.now();
    if(text === last.code && now - last.t < 2500) return;
    last = {code:text, t:now};
    handler(text);
  };
}

async function startScanner(containerId, onResult){
  if(scanners[containerId]) return;
  const el = document.getElementById(containerId);
  if(!el) return;
  el.classList.add('active');
  try{
    const config = { fps:10, qrbox:220 };
    if(SUPPORTED_FORMATS) config.formatsToSupport = SUPPORTED_FORMATS;
    const inst = new Html5Qrcode(containerId, {verbose:false});
    scanners[containerId] = inst;
    await inst.start({facingMode:"environment"}, config, makeDebounced(onResult), ()=>{});
  }catch(err){
    delete scanners[containerId];
    el.classList.remove('active');
    alert('تعذر تشغيل الكاميرا، تأكد من السماح بالوصول إليها. '+ (err && err.message ? err.message : ''));
  }
}
async function stopScanner(containerId){
  const inst = scanners[containerId];
  const el = document.getElementById(containerId);
  if(el) el.classList.remove('active');
  if(!inst) return;
  try{ await inst.stop(); inst.clear(); }catch(e){}
  delete scanners[containerId];
}
function stopAllScanners(){
  Object.keys(scanners).forEach(id=>stopScanner(id));
}

  function refreshActivationStatus(){
    const active = currentActiveEntry();
    document.getElementById('attActivationStatus').textContent = active ? '✅ الحضور مُفعّل لهذه اللجنة اليوم' : '⚪ الحضور غير مفعل بعد';

    const presentToday = state.attendance.filter(a=>a.date===today && committeeMembers.some(m=>m.code===a.code));
    area.innerHTML = `
      <div class="card">
        <h3>تسجيل الحضور — ${committeeName(committee)}</h3>
        <div class="scan-row">

        </div>
        <div class="reader-box" id="reader-att" style="margin-top:12px;"></div>
        <div id="attMsg" class="found-box" style="display:none;"></div>
      </div>

        <div class="stat-box green"><div class="num" id="attPresentCount">${presentToday.length}</div><div class="lbl">تم الحضور</div></div>
        <div class="stat-box red"><div class="num" id="attAbsentCount">${Math.max(committeeMembers.length - presentToday.length,0)}</div><div class="lbl">غياب اليوم</div></div>
      </div>
      <div class="card">
        <h3>الحاضرون اليوم</h3>
        <div class="table-wrap" id="attPresentList"></div>
      </div>

    });
    document.getElementById('attCamBtn').addEventListener('click', async ()=>{
      if(scanners['reader-att']){ await stopScanner('reader-att'); return; }
      await startScanner('reader-att', (text)=> markAttendance(text));
    });
  }
  function renderPresentList(){
    const committee = committeeSelect.value;
    const committeeMembers = state.members.filter(m=>m.committee===committee);
    const presentToday = state.attendance.filter(a=>a.date===today && committeeMembers.some(m=>m.code===a.code));

    if(presentToday.length===0){

        }).join('')}

    box.style.display='block';
    box.className = 'found-box ' + (ok?'ok':'err');
    box.textContent = text;

    const committee = committeeSelect.value;
    const m = state.members.find(x=>x.code===code);
    if(!m){ showAttMsg('لا يوجد عضو بهذا الكود', false); return; }
    if(m.committee !== committee){ showAttMsg(`العضو "${m.name}" ينتمي للجنة أخرى (${committeeName(m.committee)})`, false); return; }
    if(state.attendance.some(a=>a.code===code && a.date===today)){ showAttMsg(`تم تسجيل حضور "${m.name}" مسبقاً اليوم`, true); return; }
    state.attendance.push({code, date:today});
    persist('attendance');
    showAttMsg(`تم تسجيل حضور: ${m.name} ✅`, true);
    const committeeMembers = state.members.filter(mm=>mm.committee===committee);
    const presentToday = state.attendance.filter(a=>a.date===today && committeeMembers.some(mm=>mm.code===a.code));
    const pc = document.getElementById('attPresentCount'); if(pc) pc.textContent = presentToday.length;
    const ac = document.getElementById('attAbsentCount'); if(ac) ac.textContent = Math.max(committeeMembers.length - presentToday.length,0);
    renderPresentList();
  }

  document.getElementById('activateDayBtn').addEventListener('click', ()=>{
    if(!currentActiveEntry()){
      state.activeDays.push({date:today, committee:committeeSelect.value});
      persist('activeDays');
    }
    refreshActivationStatus();
  });
  document.getElementById('deactivateDayBtn').addEventListener('click', ()=>{

    if(!confirm('سيتم إلغاء تفعيل اليوم وحذف سجلات الحضور المسجلة اليوم لهذه اللجنة. متابعة؟')) return;
    const committee = committeeSelect.value;
    state.activeDays = state.activeDays.filter(d=>!(d.date===today && d.committee===committee));
    const committeeMembers = state.members.filter(m=>m.committee===committee).map(m=>m.code);
    state.attendance = state.attendance.filter(a=>!(a.date===today && committeeMembers.includes(a.code)));
    persist('activeDays'); persist('attendance');
    refreshActivationStatus();
  });
  committeeSelect.addEventListener('change', refreshActivationStatus);
  refreshActivationStatus();
}

        ${CATEGORIES.map(c=>`<button class="cat-chip ${c.id===state.pointsCategory?'active':''}" data-cat="${c.id}">${c.label}</button>`).join('')}
      </div>
      <div class="grid2">
        <div class="field"><label>عدد النقاط</label><input id="pointsValueInput" type="number" value="${(CATEGORIES.find(c=>c.id===state.pointsCategory)||CATEGORIES[0]).points}"></div>
        <div class="field"><label>بحث عن عضو (كود)</label>
          <div class="scan-row">
            <input id="ptsManualInput" type="text" placeholder="كود العضو">
            <button class="btn-ghost" id="ptsManualBtn" style="width:auto;">بحث</button>
            <button class="btn-ghost" id="ptsCamBtn" style="width:auto;">📷</button>
          </div>
        </div>
      </div>
      <div class="reader-box" id="reader-pts" style="margin-top:12px;"></div>
      <div id="ptsFoundBox" class="found-box">لم يتم اختيار عضو بعد</div>
      <button class="btn-primary" id="confirmPointsBtn" style="width:auto; padding:11px 24px; margin-top:6px;" disabled>✅ تأكيد ومنح النقاط</button>
    </div>

    <div class="card">
      <h3>أحدث تقييمات اليوم</h3>
      <div class="table-wrap" id="recentPointsList"></div>
    </div>
  `;

  function renderRecentList(){
    const list = state.points.filter(p=>p.date===today).slice().reverse().slice(0,15);
    const wrap = document.getElementById('recentPointsList');
    if(list.length===0){ wrap.innerHTML = `<div class="empty-state" style="padding:20px;"><div class="em">⭐</div>لا يوجد تقييمات اليوم بعد</div>`; return; }
    wrap.innerHTML = `
      <table><thead><tr><th>الاسم</th><th>التقييم</th><th>النقاط</th></tr></thead><tbody>
        ${list.map(p=>{
          const m = state.members.find(x=>x.code===p.code);
          return `<tr><td>${m?escapeHtml(m.name):p.code}</td><td>${escapeHtml(categoryLabel(p.category))}</td><td>${p.points}+</td></tr>`;
        }).join('')}
      </tbody></table>`;
  }

  document.getElementById('catRow').addEventListener('click', e=>{
    const b = e.target.closest('.cat-chip'); if(!b) return;
    state.pointsCategory = b.dataset.cat;
    panel.querySelectorAll('.cat-chip').forEach(c=>c.classList.toggle('active', c===b));
    document.getElementById('pointsValueInput').value = (CATEGORIES.find(c=>c.id===state.pointsCategory)||CATEGORIES[0]).points;
  });

  function showFound(code){
    const m = state.members.find(x=>x.code===code);
    const box = document.getElementById('ptsFoundBox');
    const btn = document.getElementById('confirmPointsBtn');
    if(!m){
      box.className='found-box err'; box.textContent='لا يوجد عضو بهذا الكود';
      state.pointsFoundCode = null; btn.disabled = true; return;
    }
    box.className='found-box ok';
    box.innerHTML = `العضو المحدد: <b>${escapeHtml(m.name)}</b> — <span class="chip ${m.committee}">${committeeName(m.committee)}</span>`;
    state.pointsFoundCode = code;
    btn.disabled = false;
  }
  document.getElementById('ptsManualBtn').addEventListener('click', ()=>{
    const code = document.getElementById('ptsManualInput').value.trim();
    if(code) showFound(code);
  });
  document.getElementById('ptsCamBtn').addEventListener('click', async ()=>{
    if(scanners['reader-pts']){ await stopScanner('reader-pts'); return; }
    await startScanner('reader-pts', (text)=> showFound(text));
  });
  document.getElementById('confirmPointsBtn').addEventListener('click', ()=>{
    if(!state.pointsFoundCode) return;
    const pts = Number(document.getElementById('pointsValueInput').value) || 0;
    state.points.push({code:state.pointsFoundCode, date:today, category:state.pointsCategory, points:pts});
    persist('points');
    const m = state.members.find(x=>x.code===state.pointsFoundCode);
    const box = document.getElementById('ptsFoundBox');
    box.className='found-box ok';
    box.innerHTML = `✅ تم منح ${pts} نقطة لـ <b>${m?escapeHtml(m.name):''}</b>`;
    document.getElementById('confirmPointsBtn').disabled = true;
    state.pointsFoundCode = null;
    document.getElementById('ptsManualInput').value='';
    const total = state.points.filter(p=>p.date===today).reduce((s,p)=>s+Number(p.points||0),0);
    panel.querySelector('.tab-sub').innerHTML = `إجمالي النقاط الممنوحة اليوم: <b>${total}</b>`;
    renderRecentList();
  });

  renderRecentList();
}

  panel.innerHTML = `

    <div class="tab-sub">تقارير الأعضاء والإحصائيات العامة</div>

    <div class="card">
      <h3>👤 استعلام عن تقرير عضو</h3>

        <div class="field"><label>بحث بالاسم أو الكود</label><input id="repSearchInput" type="text" placeholder="اكتب اسم أو كود العضو"></div>
        <div class="field"><label>تصفية باللجنة</label><select id="repCommitteeFilter">${committeeOptions(true)}</select></div>
      </div>

          <select id="repPeriodType"><option value="day">تقرير يومي</option><option value="month">تقرير شهري</option></select>
        </div>
        <div class="field" id="repDateFieldWrap"><label>التاريخ</label><input id="repDateInput" type="date" value="${todayStr()}"></div>
        <div class="field"><label>اللجنة المستهدفة</label><select id="repGenCommittee">${committeeOptions(true)}</select></div>

        <label>نوع التقرير المطلوب</label>
        <select id="repTypeSelect">

          <option value="attendance">📅 تقارير الحضور والغياب فقط</option>
          <option value="points">⭐ تقارير المهام والنقاط فقط</option>
        </select>

  const periodSelect = document.getElementById('repPeriodType');

    }else{
      const cur = todayStr().slice(0,7);

    }

  function doSearch(){

    const cf = document.getElementById('repCommitteeFilter').value;
    let list = state.members.filter(m=> (cf==='all' || m.committee===cf));
    if(q) list = list.filter(m=> m.name.toLowerCase().includes(q) || m.code.toLowerCase().includes(q));
    const wrap = document.getElementById('repSearchResults');
    if(list.length===0){ wrap.innerHTML = `<div class="empty-state" style="padding:18px;">لا توجد نتائج</div>`; return; }
    wrap.innerHTML = `
      <table><thead><tr><th>الكود</th><th>الاسم</th><th>اللجنة</th><th></th></tr></thead><tbody>
        ${list.slice(0,30).map(m=>`
          <tr>
            <td>${escapeHtml(m.code)}</td><td>${escapeHtml(m.name)}</td>
            <td><span class="chip ${m.committee}">${committeeName(m.committee)}</span></td>
            <td><button class="icon-btn open-rep" data-code="${m.code}">عرض التقرير</button></td>
          </tr>`).join('')}

function generateGeneralReport(periodType, dateVal, committeeFilter, reportType){
  const members = state.members.filter(m=> committeeFilter==='all' || m.committee===committeeFilter);
  const rows = members.map(m=>{
    let present=0, absent=0, pts=0;
    if(periodType==='day'){
      present = state.attendance.some(a=>a.code===m.code && a.date===dateVal) ? 1 : 0;
      const activated = state.activeDays.some(d=>d.date===dateVal && d.committee===m.committee);
      absent = (activated && !present) ? 1 : 0;
      pts = state.points.filter(p=>p.code===m.code && p.date===dateVal).reduce((s,p)=>s+Number(p.points||0),0);
    }else{
      present = state.attendance.filter(a=>a.code===m.code && a.date.startsWith(dateVal)).length;
      const activatedCount = state.activeDays.filter(d=>d.committee===m.committee && d.date.startsWith(dateVal)).length;
      absent = Math.max(activatedCount - present, 0);
      pts = state.points.filter(p=>p.code===m.code && p.date.startsWith(dateVal)).reduce((s,p)=>s+Number(p.points||0),0);
    }
    return {m, present, absent, pts};
  });
  const totalPresent = rows.reduce((s,r)=>s+r.present,0);
  const totalAbsent = rows.reduce((s,r)=>s+r.absent,0);
  const totalPts = rows.reduce((s,r)=>s+r.pts,0);
  const showAtt = reportType==='full' || reportType==='attendance';
  const showPts = reportType==='full' || reportType==='points';
  const periodLabel = periodType==='day' ? fmtDate(dateVal) : dateVal;

  const html = `
    <div id="genReportPrintArea">
      <h2 style="font-size:18px; margin-bottom:4px;">التقرير ${periodType==='day'?'اليومي':'الشهري'}</h2>
      <div style="color:var(--muted); font-size:13px; margin-bottom:14px;">
        ${periodLabel} — ${committeeFilter==='all' ? 'كل اللجان' : committeeName(committeeFilter)}
      </div>
      <div class="stat-row">
        ${showAtt? `<div class="stat-box green"><div class="num">${totalPresent}</div><div class="lbl">إجمالي الحضور</div></div>
        <div class="stat-box red"><div class="num">${totalAbsent}</div><div class="lbl">إجمالي الغياب</div></div>` : ''}
        ${showPts? `<div class="stat-box"><div class="num">${totalPts}</div><div class="lbl">إجمالي النقاط</div></div>` : ''}
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>الاسم</th><th>اللجنة</th>
            ${showAtt? '<th>حضور</th><th>غياب</th>' : ''}
            ${showPts? '<th>النقاط</th>' : ''}
          </tr></thead>
          <tbody>
            ${rows.length? rows.map(r=>`
              <tr>
                <td>${escapeHtml(r.m.name)}</td>
                <td><span class="chip ${r.m.committee}">${committeeName(r.m.committee)}</span></td>
                ${showAtt? `<td>${r.present}</td><td>${r.absent}</td>` : ''}
                ${showPts? `<td>${r.pts}</td>` : ''}
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center; color:var(--muted);">لا يوجد أعضاء</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
  openModal(`
    ${html}
    <div class="modal-actions no-print">
      <button class="btn-outline-red" id="printGenReportBtn">🖨️ طباعة / حفظ PDF</button>
    </div>
  `);
  document.getElementById('printGenReportBtn').addEventListener('click', ()=>printElementById('modalRoot'));
}

/* ================= BACKUP TAB ================= */
function renderBackupTab(){
  const panel = document.getElementById('tab-backup');
  panel.innerHTML = `
    <h1>النسخ الاحتياطي</h1>
    <div class="tab-sub">تحميل نسخة من كل البيانات أو استعادة نسخة سابقة</div>
    <div class="card">
      <h3>💾 تحميل نسخة احتياطية</h3>
      <p style="font-size:13.5px; color:var(--muted); margin-bottom:14px;">يتم تنزيل ملف JSON يحتوي على كل الأعضاء وسجلات الحضور والنقاط.</p>
      <button class="btn-outline-red" id="downloadBackupBtn" style="width:auto; padding:10px 20px;">⬇️ تحميل نسخة</button>
    </div>
    <div class="card">
      <h3>♻️ استعادة نسخة احتياطية</h3>
      <p style="font-size:13.5px; color:var(--muted); margin-bottom:14px;">تحذير: استعادة نسخة ستستبدل كل البيانات الحالية.</p>
      <input type="file" id="restoreFileInput" accept="application/json">
    </div>
    <div class="card">
      <h3>📌 إحصائيات سريعة</h3>
      <div class="stat-row">
        <div class="stat-box"><div class="num">${state.members.length}</div><div class="lbl">عضو</div></div>
        <div class="stat-box"><div class="num">${state.attendance.length}</div><div class="lbl">سجل حضور</div></div>
        <div class="stat-box"><div class="num">${state.points.length}</div><div class="lbl">سجل تقييم</div></div>
      </div>
    </div>
  `;
  document.getElementById('downloadBackupBtn').addEventListener('click', ()=>{
    const data = {
      members: state.members, attendance: state.attendance, points: state.points, activeDays: state.activeDays,
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `tedx-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  document.getElementById('restoreFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!confirm('سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. هل تريد المتابعة؟')) return;
        state.members = Array.isArray(data.members)? data.members : [];
        state.attendance = Array.isArray(data.attendance)? data.attendance : [];
        state.points = Array.isArray(data.points)? data.points : [];
        state.activeDays = Array.isArray(data.activeDays)? data.activeDays : [];
        await persist('members'); await persist('attendance'); await persist('points'); await persist('activeDays');
        alert('تم استعادة النسخة الاحتياطية بنجاح');
        renderBackupTab();
      }catch(err){
        alert('ملف غير صالح، تعذر قراءة النسخة الاحتياطية');
      }
    };
    reader.readAsText(file);
  });
}

/* ================= GLOBAL EVENTS (single delegated listener — one missing element can't break the rest) ================= */
async function doLeaderLogin(){
  const passEl = document.getElementById('leaderPassInput');
  const errEl = document.getElementById('leaderLoginError');
  if(!passEl) return;
  if(passEl.value === LEADER_PASSWORD){
    state.isLeader = true;
    await go('dashboard');
    switchTab('members');
  }else if(errEl){
    errEl.textContent = 'كلمة المرور غير صحيحة';
  }
}

function doMemberLookup(){
  const input = document.getElementById('memberLookupInput');
  const resultEl = document.getElementById('memberLookupResult');
  if(!input || !resultEl) return;
  const code = input.value.trim();
  if(!code) return;
  if(!state.members.some(m=>m.code===code)){
    resultEl.innerHTML = `<div class="found-box err" style="margin-top:14px;">لا يوجد عضو بهذا الكود</div>`;
    return;
  }
  resultEl.innerHTML = `<div class="found-box ok" style="margin-top:14px;">تم العثور على العضو ✅</div>`;
  openModal(`
    ${memberReportBody(code)}
    <div class="modal-actions no-print">
      <button class="btn-outline-red" id="lookupPrintBtn">🖨️ طباعة / حفظ PDF</button>
    </div>
  `);
  const printBtn = document.getElementById('lookupPrintBtn');
  if(printBtn) printBtn.addEventListener('click', ()=>printElementById('modalRoot'));
}

async function toggleMemberLookupCam(){
  if(scanners['reader-lookup']){ await stopScanner('reader-lookup'); return; }
  await startScanner('reader-lookup', async (text)=>{
    const input = document.getElementById('memberLookupInput');
    if(input) input.value = text;
    await stopScanner('reader-lookup');
    doMemberLookup();
  });
}

document.addEventListener('click', (e)=>{
  const goBtn = e.target.closest('[data-go]');
  if(goBtn){ go(goBtn.dataset.go); return; }

  if(e.target.closest('#leaderLoginBtn')){ doLeaderLogin(); return; }
  if(e.target.closest('#memberLookupBtn')){ doMemberLookup(); return; }
  if(e.target.closest('#memberLookupCamBtn')){ toggleMemberLookupCam(); return; }

  const navBtn = e.target.closest('.sidebar .nav-btn');
  if(navBtn){ switchTab(navBtn.dataset.tab); return; }

  if(e.target.closest('#logoutBtn')){ state.isLeader = false; go('gate'); return; }
});

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  if(e.target.id === 'leaderPassInput') doLeaderLogin();
  if(e.target.id === 'memberLookupInput') doMemberLookup();
});

/* ================= INIT ================= */
(async function init(){
  await loadAll();
})();
</script>
